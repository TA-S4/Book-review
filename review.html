<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review Details</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn { color: #0070f3; text-decoration: none; font-weight: 600; }
        .edit-btn {
            background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db;
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .review-main-container {
            background: white; padding: 35px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 25px;
        }
        .detail-card-top { display: flex; gap: 30px; border-bottom: 1px solid #f0f0f0; padding-bottom: 25px; }
        .display-cover { width: 160px; height: 240px; object-fit: cover; border-radius: 6px; background: #e2e8f0; }
        .display-info { flex-grow: 1; display: flex; flex-direction: column; }
        .book-type-tag {
            display: inline-block; background: #e2e8f0; color: #475569; padding: 4px 10px;
            border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; align-self: flex-start;
        }
        h1 { margin-top: 0; font-size: 2.2rem; }
        .meta-info { color: #666; font-size: 1.05rem; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 25px; }
        .rating { color: #ffb400; font-weight: bold; }
        .time-box { background: #eef6ff; color: #0070f3; padding: 10px 15px; border-radius: 6px; font-weight: 600; align-self: flex-start; }
        .notes-section-container { display: flex; flex-direction: column; width: 100%; }
        .notes-heading-area { font-size: 1.4rem; font-weight: bold; margin-bottom: 15px; color: #222; }
        .permanent-notes-input {
            width: 100%; min-height: 300px; font-size: 1.1rem; line-height: 1.7; font-family: inherit;
            padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; background-color: #fafafa;
        }
        .form-container { background: white; padding: 35px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem;
        }
        .date-row { display: flex; gap: 15px; }
        .date-row .form-group { flex: 1; }
        .image-preview-container { display: flex; align-items: center; gap: 20px; margin-top: 5px; }
        .preview-img-element { width: 80px; height: 120px; object-fit: cover; border: 1px dashed #ccc; border-radius: 4px; }
        .action-btn { background-color: #0070f3; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="back-btn">← Back to All Reviews</a>
        <button id="editBtn" class="edit-btn" onclick="openEditForm()" style="display:none;">✏️ Edit Book</button>
    </div>

    <!-- VIEW DISPLAY -->
    <main id="view-section" style="display:none;">
        <div class="review-main-container">
            <article class="detail-card-top">
                <img id="viewCover" class="display-cover" src="" alt="Book Cover">
                <div class="display-info">
                    <span id="viewType" class="book-type-tag"></span>
                    <h1 id="viewTitle"></h1>
                    <div class="meta-info">
                        By <strong id="viewAuthor"></strong> | 
                        <span id="viewRating" class="rating"></span> | 
                        Pages: <span id="viewPages"></span>
                    </div>
                    <div id="viewTime" class="time-box"></div>
                </div>
            </article>

            <section class="notes-section-container">
                <div class="notes-heading-area">My Notes & Thoughts:</div>
                <textarea id="liveNotesInput" class="permanent-notes-input" readonly placeholder="No notes available."></textarea>
            </section>
        </div>
    </main>

    <!-- CREATION / EDIT FORM -->
    <main id="form-section" style="display:none;">
        <div class="form-container">
            <h2 id="formTitle">Add New Book Review</h2>
            <form id="reviewForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="bookTitle">Book Name</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Author Name</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label for="bookType">Book Type / Genre</label>
                    <select id="bookType" required>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Fiction">Fiction</option>
                        <option value="History">History</option>
                        <option value="Strategy / Politics">Strategy / Politics</option>
                        <option value="Philosophy">Philosophy</option>
                        <option value="Biography">Biography</option>
                        <option value="Science / Tech">Science / Tech</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bookRating">Rating (1 to 5 Stars)</label>
                    <input type="number" id="bookRating" min="1" max="5" required>
                </div>
                <div class="form-group">
                    <label for="pageNumber">Page Count</label>
                    <input type="number" id="pageNumber" required>
                </div>
                <div class="date-row">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="finishDate">Finish Date</label>
                        <input type="date" id="finishDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bookCoverInput">Upload Book Photo Cover</label>
                    <div class="image-preview-container">
                        <input type="file" id="bookCoverInput" accept="image/*" onchange="previewImage(this)">
                        <img id="formImagePreview" class="preview-img-element" src="" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bookReviewText">Detailed Review / Notes</label>
                    <textarea id="bookReviewText" rows="6"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="action-btn">Save Directly to GitHub</button>
            </form>
        </div>
    </main>

    <script>
        // CONFIGURATION - GITHUB DETAILS:
        const GITHUB_USERNAME = "ta-s4";          
        const GITHUB_REPO = "Book-review";        

        let currentId = null;
        let reviews = [];
        let base64CoverString = "";
        let isAdmin = false;
        let fileSha = ""; 

        window.onload = function() {
            isAdmin = localStorage.getItem('is_admin') === 'true';

            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            // Fetch books.json directly via GitHub API to get SHA and contents
            fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/books.json?t=` + Date.now())
                .then(res => res.json())
                .then(data => {
                    fileSha = data.sha;
                    reviews = JSON.parse(decodeURIComponent(escape(atob(data.content)))); // Decode Base64 UTF-8

                    if (idParam === 'new') {
                        if (!isAdmin) {
                            alert("Admin access required.");
                            window.location.href = 'index.html';
                            return;
                        }
                        currentId = 'new';
                        document.getElementById('form-section').style.display = 'block';
                    } else {
                        currentId = parseInt(idParam);
                        showDisplayView();
                    }
                })
                .catch(err => {
                    console.error("Error fetching books.json:", err);
                });
        };

        function showDisplayView() {
            const review = reviews.find(r => r.id === currentId);
            if (!review) {
                document.body.innerHTML = `<div style="text-align:center; padding:50px;"><h2>Review not found.</h2><a href="index.html">Back Home</a></div>`;
                return;
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('view-section').style.display = 'block';
            if (isAdmin) {
                document.getElementById('editBtn').style.display = 'inline-block';
            }

            document.getElementById('viewType').innerText = review.type || '';
            document.getElementById('viewTitle').innerText = review.title || '';
            document.getElementById('viewAuthor').innerText = review.author || '';
            document.getElementById('viewPages').innerText = review.pages || '';
            document.getElementById('liveNotesInput').value = review.notes || '';

            const rating = review.rating || 0;
            document.getElementById('viewRating').innerText = '★'.repeat(rating) + '☆'.repeat(5 - rating) + ` (${rating}/5)`;

            if (review.start && review.finish) {
                const start = new Date(review.start);
                const finish = new Date(review.finish);
                const daysDiff = Math.ceil((finish - start) / (1000 * 3600 * 24));
                document.getElementById('viewTime').innerText = `⏱️ ${daysDiff === 0 ? "Read in 1 day" : `Read in ${daysDiff} days`} (${review.start} – ${review.finish})`;
            }

            const defaultSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="240"><rect width="100%" height="100%" fill="%23cbd5e1"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" fill="%2364748b">No Image</text></svg>';
            document.getElementById('viewCover').src = review.cover ? review.cover : defaultSvg;
        }

        function openEditForm() {
            const review = reviews.find(r => r.id === currentId);
            if (!review) return;

            document.getElementById('bookTitle').value = review.title || '';
            document.getElementById('bookAuthor').value = review.author || '';
            document.getElementById('bookType').value = review.type || 'Non-Fiction';
            document.getElementById('bookRating').value = review.rating || 5;
            document.getElementById('pageNumber').value = review.pages || '';
            document.getElementById('startDate').value = review.start || '';
            document.getElementById('finishDate').value = review.finish || '';
            document.getElementById('bookReviewText').value = review.notes || '';
            base64CoverString = review.cover || "";

            document.getElementById('formTitle').innerText = "Edit Book Review";
            document.getElementById('view-section').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            document.getElementById('editBtn').style.display = 'none';
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64CoverString = e.target.result;
                    document.getElementById('formImagePreview').src = base64CoverString;
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            let ghToken = localStorage.getItem('gh_token');
            if (!ghToken) {
                ghToken = prompt("Enter your GitHub Personal Access Token:");
                if (!ghToken) return;
                localStorage.setItem('gh_token', ghToken);
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Committing directly to GitHub...";

            const reviewObject = {
                id: currentId === 'new' ? Date.now() : currentId,
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                type: document.getElementById('bookType').value,
                rating: parseInt(document.getElementById('bookRating').value),
                pages: document.getElementById('pageNumber').value,
                start: document.getElementById('startDate').value,
                finish: document.getElementById('finishDate').value,
                notes: document.getElementById('bookReviewText').value,
                cover: base64CoverString
            };

            if (currentId === 'new') {
                reviews.push(reviewObject);
            } else {
                const idx = reviews.findIndex(r => r.id === currentId);
                if (idx !== -1) reviews[idx] = reviewObject;
            }

            const updatedJsonString = JSON.stringify(reviews, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonString)));

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/books.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Update book review: ${reviewObject.title}`,
                        content: encodedContent,
                        sha: fileSha
                    })
                });

                if (response.ok) {
                    alert("✓ Saved successfully! Committed straight to GitHub.");
                    window.location.href = 'index.html';
                } else {
                    const errData = await response.json();
                    alert("GitHub Error: " + errData.message + "\nCheck if your token is valid.");
                    localStorage.removeItem('gh_token'); 
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Save Directly to GitHub";
                }
            } catch (err) {
                alert("Network error saving to GitHub: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Save Directly to GitHub";
            }
        }
    </script>
</body>
</html>
