<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #0070f3;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .detail-card {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .book-type-tag {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
        }
        .meta-info {
            color: #666;
            font-size: 1.05rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .rating {
            color: #ffb400;
            font-weight: bold;
        }
        .notes-section {
            font-size: 1.1rem;
            white-space: pre-line;
            line-height: 1.8;
            color: #222;
        }
        .time-box {
            background: #eef6ff;
            color: #0070f3;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to All Reviews</a>

    <main id="review-container">
        <p>Loading review details...</p>
    </main>

    <script>
        window.onload = function() {
            // Read the book ID from URL parameter (e.g., ?id=123456)
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = parseInt(urlParams.get('id'));

            // Load saved data
            const savedData = localStorage.getItem('my_book_reviews');
            if (!savedData) {
                document.getElementById('review-container').innerHTML = "<h2>Review not found.</h2>";
                return;
            }

            const reviews = JSON.parse(savedData);
            const review = reviews.find(r => r.id === bookId);

            if (!review) {
                document.getElementById('review-container').innerHTML = "<h2>Review not found.</h2>";
                return;
            }

            // Calculate reading days
            const start = new Date(review.start);
            const finish = new Date(review.finish);
            const daysDiff = Math.ceil((finish - start) / (1000 * 3600 * 24));
            
            let durationText = "";
            if (daysDiff < 0) durationText = "Invalid dates";
            else if (daysDiff === 0) durationText = "Read in 1 day";
            else durationText = `Read in ${daysDiff} days`;

            const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);

            // Update page Title tag
            document.title = `${review.title} - Book Review`;

            // Display review content
            document.getElementById('review-container').innerHTML = `
                <article class="detail-card">
                    <span class="book-type-tag">${review.type}</span>
                    <h1>${review.title}</h1>
                    <div class="meta-info">
                        By <strong>${review.author}</strong> | 
                        <span class="rating">${stars} (${review.rating}/5 Stars)</span> | 
                        Pages: ${review.pages}
                    </div>
                    <div class="time-box">⏱️ ${durationText} (${review.start} – ${review.finish})</div>
                    <h3>My Notes & Thoughts:</h3>
                    <div class="notes-section">${review.notes ? review.notes : "No detailed notes written for this book."}</div>
                </article>
            `;
        };
    </script>

</body>
</html>
