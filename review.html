<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review Details</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #0070f3;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .action-btn {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .action-btn:hover {
            background-color: #0051a2;
        }
        .save-notes-btn {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }
        .save-notes-btn:hover {
            background-color: #22863a;
        }
        
        .detail-card {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            gap: 30px;
        }
        .display-cover {
            width: 160px;
            height: 240px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #e2e8f0;
        }
        .display-info {
            flex-grow: 1;
        }
        .book-type-tag {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        h1 { margin-top: 0; font-size: 2.2rem; }
        .meta-info {
            color: #666;
            font-size: 1.05rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .rating { color: #ffb400; font-weight: bold; }
        .time-box {
            background: #eef6ff;
            color: #0070f3;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        .notes-heading-area {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .notes-container {
            min-height: 100px;
        }
        .notes-section {
            font-size: 1.1rem;
            white-space: pre-line;
            line-height: 1.8;
            color: #222;
            padding: 5px 0;
        }
        .edit-notes-textarea {
            width: 100%;
            font-size: 1.1rem;
            line-height: 1.6;
            font-family: inherit;
            padding: 10px;
            border: 1px solid #0070f3;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }

        /* Form view for brand new books only */
        .form-container {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem;
        }
        .date-row { display: flex; gap: 15px; }
        .date-row .form-group { flex: 1; }
        .image-preview-container { display: flex; align-items: center; gap: 20px; margin-top: 5px; }
        .preview-img-element { width: 80px; height: 120px; object-fit: cover; border: 1px dashed #ccc; border-radius: 4px; background: #fdfdfd; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="back-btn">← Back to All Reviews</a>
        <button id="editReviewBtn" class="action-btn" style="display:none;">✏️ Edit Review</button>
    </div>

    <!-- VIEW DISPLAY -->
    <main id="view-section" style="display:none;">
        <article class="detail-card">
            <img id="viewCover" class="display-cover" src="" alt="Book Cover">
            <div class="display-info">
                <span id="viewType" class="book-type-tag"></span>
                <h1 id="viewTitle"></h1>
                <div class="meta-info">
                    By <strong id="viewAuthor"></strong> | 
                    <span id="viewRating" class="rating"></span> | 
                    Pages: <span id="viewPages"></span>
                </div>
                <div id="viewTime" class="time-box"></div>
                
                <div class="notes-heading-area">My Notes & Thoughts:</div>
                <div class="notes-container" id="notesContainer">
                    <div id="viewNotes" class="notes-section"></div>
                </div>
            </div>
        </article>
    </main>

    <!-- CREATION FORM (Only used when adding a completely brand new book) -->
    <main id="form-section" style="display:none;">
        <div class="form-container">
            <h2>Add New Book Review</h2>
            <form id="reviewForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="bookTitle">Book Name</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Author Name</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label for="bookType">Book Type / Genre</label>
                    <select id="bookType" required>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Fiction">Fiction</option>
                        <option value="History">History</option>
                        <option value="Strategy / Politics">Strategy / Politics</option>
                        <option value="Philosophy">Philosophy</option>
                        <option value="Biography">Biography</option>
                        <option value="Science / Tech">Science / Tech</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bookRating">Rating (1 to 5 Stars)</label>
                    <input type="number" id="bookRating" min="1" max="5" required>
                </div>
                <div class="form-group">
                    <label for="pageNumber">Page Count</label>
                    <input type="number" id="pageNumber" required>
                </div>
                <div class="date-row">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="finishDate">Finish Date</label>
                        <input type="date" id="finishDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bookCoverInput">Upload Book Photo Cover</label>
                    <div class="image-preview-container">
                        <input type="file" id="bookCoverInput" accept="image/*" onchange="previewImage(this)">
                        <img id="formImagePreview" class="preview-img-element" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='120'><rect width='100%'' height='100%' fill='%23f8fafc'/></svg>" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bookReviewText">Detailed Review / Notes</label>
                    <textarea id="bookReviewText" rows="6" placeholder="Write your thoughts..."></textarea>
                </div>
                <button type="submit" class="action-btn" style="width: 100%; padding: 12px; justify-content: center;">Save Review Details</button>
            </form>
        </div>
    </main>

    <script>
        let currentId = null;
        let reviews = [];
        let base64CoverString = ""; 
        let isEditingNotes = false;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            const savedData = localStorage.getItem('my_book_reviews');
            if (savedData) {
                reviews = JSON.parse(savedData);
            }

            if (idParam === 'new') {
                currentId = 'new';
                document.getElementById('form-section').style.display = 'block';
            } else {
                currentId = parseInt(idParam);
                showDisplayView();
            }
        };

        function showDisplayView() {
            const review = reviews.find(r => r.id === currentId);
            if (!review) {
                document.body.innerHTML = `<div style="text-align:center; padding:50px;"><h2>Review not found.</h2><a href="index.html">Back Home</a></div>`;
                return;
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('view-section').style.display = 'block';

            const editBtn = document.getElementById('editReviewBtn');
            editBtn.style.display = 'block';
            editBtn.onclick = toggleInlineNotesEdit;

            document.getElementById('viewType').innerText = review.type;
            document.getElementById('viewTitle').innerText = review.title;
            document.getElementById('viewAuthor').innerText = review.author;
            document.getElementById('viewPages').innerText = review.pages;
            
            renderNotesArea(review.notes);
            
            document.title = `${review.title} - Book Review`;

            const start = new Date(review.start);
            const finish = new Date(review.finish);
            const daysDiff = Math.ceil((finish - start) / (1000 * 3600 * 24));
            document.getElementById('viewTime').innerText = `⏱️ ${daysDiff === 0 ? "Read in 1 day" : `Read in ${daysDiff} days`} (${review.start} – ${review.finish})`;

            document.getElementById('viewRating').innerText = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating) + ` (${review.rating}/5)`;
            
            const defaultSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="240"><rect width="100%" height="100%" fill="%23cbd5e1"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" fill="%2364748b">No Image</text></svg>';
            document.getElementById('viewCover').src = review.cover ? review.cover : defaultSvg;
        }

        function renderNotesArea(notesText) {
            const container = document.getElementById('notesContainer');
            if (notesText && notesText.trim() !== "") {
                container.innerHTML = `<div id="viewNotes" class="notes-section">${notesText}</div>`;
            } else {
                container.innerHTML = `<div id="viewNotes" class="notes-section" style="color: #888; font-style: italic;">No custom thoughts typed yet. Click 'Edit Review' above to add notes.</div>`;
            }
        }

        function toggleInlineNotesEdit() {
            const review = reviews.find(r => r.id === currentId);
            const container = document.getElementById('notesContainer');
            const editBtn = document.getElementById('editReviewBtn');

            if (!isEditingNotes) {
                // Switch to Edit Mode in place
                isEditingNotes = true;
                editBtn.innerText = "❌ Cancel Edit";
                
                const currentText = review.notes || "";
                container.innerHTML = `
                    <textarea id="inlineNotesTextarea" class="edit-notes-textarea" rows="8">${currentText}</textarea>
                    <button class="save-notes-btn" onclick="saveInlineNotes()">💾 Save Notes</button>
                `;
                document.getElementById('inlineNotesTextarea').focus();
            } else {
                // Cancel and return to normal view
                isEditingNotes = false;
                editBtn.innerText = "✏️ Edit Review";
                renderNotesArea(review.notes);
            }
        }

        function saveInlineNotes() {
            const newNotesText = document.getElementById('inlineNotesTextarea').value;
            const idx = reviews.findIndex(r => r.id === currentId);
            
            // Update the object inside our reviews array
            reviews[idx].notes = newNotesText;
            
            // Save to localStorage
            localStorage.setItem('my_book_reviews', JSON.stringify(reviews));
            
            // Turn off edit mode and re-render
            isEditingNotes = false;
            document.getElementById('editReviewBtn').innerText = "✏️ Edit Review";
            renderNotesArea(newNotesText);
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64CoverString = e.target.result;
                    document.getElementById('formImagePreview').src = base64CoverString;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const targetId = Date.now();
            const reviewObject = {
                id: targetId,
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                type: document.getElementById('bookType').value,
                rating: parseInt(document.getElementById('bookRating').value),
                pages: document.getElementById('pageNumber').value,
                start: document.getElementById('startDate').value,
                finish: document.getElementById('finishDate').value,
                notes: document.getElementById('bookReviewText').value,
                cover: base64CoverString
            };

            reviews.push(reviewObject);
            localStorage.setItem('my_book_reviews', JSON.stringify(reviews));
            window.location.href = `review.html?id=${targetId}`;
        }
    </script>
</body>
</html>
